name: Deploy Website

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Two targets from one push, both serving the same `website/` directory:
#   deploy         -> GitHub Pages  (gleam-ai.github.io/Gleam/)
#   deploy-edgeone -> EdgeOne Makers (gleam.wangjn.top via CNAME)
# The EdgeOne job needs the EDGEONE_PAGES_API_TOKEN repository secret
# (Makers console -> Settings -> API Token). It fails loudly when it is missing.
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v5

  deploy-edgeone:
    name: Deploy to EdgeOne Makers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: website
          persist-credentials: false
      - name: Stage the site without the bundled binaries
        run: rsync -a --exclude dist website/ site/
      # Pin the target project by ID. With token auth the CLI did not resolve
      # the project by name and created a second one; the ID is not a secret.
      - name: Pin the EdgeOne project
        run: |
          mkdir -p site/.edgeone
          echo '{"Name":"gleam","ProjectId":"makers-lyn8mnqyssfm"}' > site/.edgeone/project.json
      - name: Install EdgeOne CLI
        run: npm install -g edgeone@latest
      - name: Deploy
        working-directory: site
        env:
          PAGES_SOURCE: skills
          EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
        run: edgeone makers deploy -n gleam --json
