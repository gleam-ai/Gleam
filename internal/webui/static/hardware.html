<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 硬件设备 · Gleam</title>
    <link rel="stylesheet" href="01-base.css" />
    <link rel="stylesheet" href="02-shell.css" />
    <link rel="stylesheet" href="03-align.css" />
    <link rel="stylesheet" href="hardware.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="sidebar-header">
          <img src="gleam-logo.svg" alt="Gleam" class="logo" />
          <span class="brand">Gleam</span>
        </div>
        <nav class="sidebar-nav">
          <a href="index.html" class="nav-item">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"
              />
            </svg>
            <span>对话</span>
          </a>
          <a href="index.html#goals" class="nav-item">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M12 6v6l4 2" />
            </svg>
            <span>目标</span>
          </a>
          <a href="index.html#tools" class="nav-item">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"
              />
            </svg>
            <span>工具</span>
          </a>
          <a href="hardware.html" class="nav-item active">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="4" y="4" width="16" height="16" rx="2" />
              <path d="M9 9h6v6H9z" />
            </svg>
            <span>硬件设备</span>
          </a>
          <a href="index.html#settings" class="nav-item">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"
              />
            </svg>
            <span>设置</span>
          </a>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <h1>AI 硬件设备</h1>
          <div class="topbar-actions">
            <button class="btn btn-ghost" id="refresh-btn">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M23 4v6h-6M1 20v-6h6" />
                <path
                  d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"
                />
              </svg>
              刷新
            </button>
          </div>
        </header>

        <div class="content">
          <!-- Device List -->
          <section class="device-list-section">
            <h2>已注册设备</h2>
            <div class="device-grid" id="device-grid">
              <!-- Devices will be rendered here -->
            </div>
          </section>

          <!-- Connected Devices -->
          <section class="connected-section">
            <h2>已连接设备</h2>
            <div class="connected-list" id="connected-list">
              <div class="empty-state">
                <svg
                  width="48"
                  height="48"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                >
                  <rect x="4" y="4" width="16" height="16" rx="2" />
                  <path d="M9 9h6v6H9z" />
                </svg>
                <p>暂无已连接设备</p>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <!-- Xiaohong Setup Modal -->
    <div class="modal" id="xiaohong-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>连接 AtomGit 小鸿</h3>
          <button class="modal-close" data-close>&times;</button>
        </div>
        <div class="modal-body">
          <div class="setup-steps">
            <div class="step active" data-step="1">
              <div class="step-number">1</div>
              <div class="step-content">
                <h4>扫描 WiFi 网络</h4>
                <p>小鸿将扫描周围的 WiFi 网络</p>
                <button class="btn btn-primary" id="scan-wifi-btn">
                  开始扫描
                </button>
              </div>
            </div>
            <div class="step" data-step="2">
              <div class="step-number">2</div>
              <div class="step-content">
                <h4>选择 WiFi 并输入密码</h4>
                <div class="wifi-list" id="wifi-list"></div>
                <div class="wifi-password">
                  <input
                    type="password"
                    id="wifi-password"
                    placeholder="输入 WiFi 密码"
                  />
                  <button class="btn btn-primary" id="connect-wifi-btn">
                    连接
                  </button>
                </div>
              </div>
            </div>
            <div class="step" data-step="3">
              <div class="step-number">3</div>
              <div class="step-content">
                <h4>等待连接</h4>
                <div class="connecting-animation">
                  <div class="spinner"></div>
                  <p>正在连接到 WiFi...</p>
                </div>
              </div>
            </div>
            <div class="step" data-step="4">
              <div class="step-number">✓</div>
              <div class="step-content">
                <h4>连接成功</h4>
                <p>小鸿已成功连接到网络</p>
                <button class="btn btn-primary" data-close>完成</button>
              </div>
            </div>
            <div class="step" data-step="error">
              <div class="step-number">!</div>
              <div class="step-content">
                <h4>连接失败</h4>
                <p id="error-message">WiFi 连接失败，请检查密码后重试</p>
                <button class="btn btn-secondary" id="retry-btn">
                  重新配置
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="hardware.js"></script>
  </body>
</html>
